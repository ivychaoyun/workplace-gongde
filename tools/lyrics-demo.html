<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歌詞庫配對</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6efe2;
      --card: #fffaf1;
      --ink: #2b2420;
      --ink-soft: #6b5f55;
      --red: #b8322a;
      --gold: #f3c96b;
      --line: #d8c9ae;
      --serif: "Noto Serif TC", serif;
      --sans: "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin: 0; font-family: var(--serif); font-size: 30px; }
    .lede { margin: 4px 0 24px; color: var(--ink-soft); font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
    .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px; }
    .card + .card { margin-top: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--red); letter-spacing: 0.1em; }
    select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
    textarea { min-height: 110px; resize: vertical; font-size: 16px; }
    .field { display: block; margin-bottom: 12px; font-size: 14px; }
    .field span { display: block; margin-bottom: 4px; color: var(--ink-soft); }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button, .reroll { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; }
    .examples button:hover, .reroll:hover { border-color: var(--ink); }
    .song-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .song-title { margin: 0; font-family: var(--serif); font-size: 22px; }
    .song-meta { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
    .tag { display: inline-block; margin: 0 4px 4px 0; padding: 0 8px; border-radius: 6px; font-size: 13px; background: var(--line); }
    .tag.hit { background: var(--red); color: #fff; }
    .lyrics { margin: 0; padding: 20px; border-radius: 14px; background: var(--ink); color: var(--paper); list-style: none; counter-reset: bar; }
    .lyrics li { font-family: var(--serif); font-size: clamp(18px, 3vw, 22px); line-height: 1.9; }
    .lyrics li::before { counter-increment: bar; content: counter(bar); display: inline-block; width: 1.8em; color: #8a7d70; font-family: var(--sans); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 8px; text-align: left; border-bottom: 1px dashed var(--line); vertical-align: top; }
    th { color: var(--ink-soft); font-weight: 500; }
    td.score { font-variant-numeric: tabular-nums; text-align: right; width: 3em; }
    tr.picked td { background: #fff3d6; font-weight: 700; }
    .stats { font-size: 13px; color: var(--ink-soft); }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>歌詞庫配對</h1>
  <p class="lede">網頁會從事先寫好的歌詞庫，依「情境＋抱怨」挑最適合的一首。不用 AI、不花錢、不上傳。歌詞在 <code>js/lyric-library.js</code>，配對規則在 <code>js/lyrics.js</code>。</p>

  <div class="layout">
    <div>
      <section class="card">
        <h2>寄放抱怨</h2>
        <label class="field"><span>情境</span><select id="scenario"></select></label>
        <label class="field"><span>抱怨（選填）</span>
          <textarea id="complaint" placeholder="例：週五下午五點半，老闆說簡報要大改"></textarea>
        </label>
        <div class="examples" id="examples"></div>
      </section>

      <section class="card">
        <h2>候選排名</h2>
        <p class="stats" id="stats"></p>
        <table>
          <thead><tr><th>曲名</th><th>對到的詞</th><th>分數</th></tr></thead>
          <tbody id="ranking"></tbody>
        </table>
      </section>
    </div>

    <section class="card">
      <div class="song-head">
        <h2 class="song-title" id="title"></h2>
        <button type="button" class="reroll" id="reroll">換一首</button>
      </div>
      <p class="song-meta" id="meta"></p>
      <div id="tags"></div>
      <ol class="lyrics" id="lyrics"></ol>
    </section>
  </div>
</main>

<script src="../js/content.js"></script>
<script src="../js/lyric-library.js"></script>
<script src="../js/lyrics.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const scenarios = [...SCENARIOS, FALLBACK_SCENARIO];
const labelOf = Object.fromEntries(scenarios.map((sc) => [sc.id, sc.label]));

$("#scenario").innerHTML = scenarios.map((sc, i) => `<option value="${i}">${sc.label}</option>`).join("");

const EXAMPLES = [
  [0, "主管一直說你懂我意思吧，但我真的不懂"],
  [1, "客戶說 logo 再大一點，顏色怪怪的"],
  [2, "週五下班前老闆丟來一份報表說很簡單"],
  [3, "同事離職，交接只有半頁，現在全部變我的"],
  [4, "請病假在家發燒，主管還一直傳訊息"],
  [5, "我做的提案被主管拿去上台，功勞都是他的"],
  [5, "今天開了三個會，結論都是下次再說"],
];
$("#examples").innerHTML = EXAMPLES.map(([, text], i) => `<button type="button" data-i="${i}">${text.slice(0, 12)}⋯</button>`).join("");
$("#examples").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const [sc, text] = EXAMPLES[btn.dataset.i];
  $("#scenario").value = sc;
  $("#complaint").value = text;
  render();
});

function render(reroll = false) {
  const sc = scenarios[$("#scenario").value];
  const { verse, score, matched, ranking } = buildLyrics(sc, $("#complaint").value, { reroll });
  if (!verse) return;

  $("#title").textContent = `〈${verse.title}〉`;
  $("#meta").textContent = score > 0
    ? `${labelOf[verse.scenario]}・${verse.id}・分數 ${score}`
    : `${labelOf[verse.scenario]}・${verse.id}・沒有對到關鍵字，隨機挑一首`;
  $("#tags").innerHTML = verse.tags.map((t) => `<span class="tag ${matched.includes(t) ? "hit" : ""}">${t}</span>`).join("");
  $("#lyrics").replaceChildren(...verse.lines.map((line) => {
    const li = document.createElement("li");
    li.textContent = line;
    return li;
  }));

  $("#stats").textContent = `歌詞庫共 ${LYRIC_LIBRARY.length} 首，這次的候選有 ${ranking.length} 首。`;
  $("#ranking").innerHTML = ranking.map((r) =>
    `<tr class="${r.verse.id === verse.id ? "picked" : ""}">
      <td>${r.verse.title}<br><small>${labelOf[r.verse.scenario]}</small></td>
      <td>${r.matched.join("、") || "—"}</td>
      <td class="score">${r.score}</td>
    </tr>`).join("");
}

$("#scenario").addEventListener("change", () => render());
$("#complaint").addEventListener("input", () => render());
$("#reroll").addEventListener("click", () => render(true));
render();
</script>
</body>
</html>
