<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>免費歌詞試做</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6efe2;
      --card: #fffaf1;
      --ink: #2b2420;
      --ink-soft: #6b5f55;
      --red: #b8322a;
      --gold: #f3c96b;
      --line: #d8c9ae;
      --serif: "Noto Serif TC", serif;
      --sans: "Noto Sans TC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin: 0; font-family: var(--serif); font-size: 30px; }
    .lede { margin: 4px 0 24px; color: var(--ink-soft); font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
    .card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px; }
    .card + .card { margin-top: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--red); letter-spacing: 0.1em; }
    select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
    textarea { min-height: 110px; resize: vertical; font-size: 16px; }
    .field { display: block; margin-bottom: 12px; font-size: 14px; }
    .field span { display: block; margin-bottom: 4px; color: var(--ink-soft); }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; }
    .examples button:hover { border-color: var(--ink); }
    .keywords { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
    .keywords dt { color: var(--ink-soft); }
    .keywords dd { margin: 0; }
    .tag { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 13px; }
    .tag.user { background: var(--red); color: #fff; }
    .tag.default { background: var(--line); color: var(--ink); }
    .lyrics { margin: 0; padding: 20px; border-radius: 14px; background: var(--ink); color: var(--paper); list-style: none; counter-reset: bar; }
    .lyrics li { font-family: var(--serif); font-size: clamp(18px, 3vw, 22px); line-height: 1.9; }
    .lyrics li::before { counter-increment: bar; content: counter(bar); display: inline-block; width: 1.8em; color: #8a7d70; font-family: var(--sans); font-size: 12px; }
    .lyrics .user { color: var(--gold); }
    .lyrics .default { color: #c9bba3; text-decoration: underline dotted; text-underline-offset: 4px; }
    .legend { margin: 10px 0 0; font-size: 12px; color: var(--ink-soft); }
    .legend .user { color: var(--red); font-weight: 700; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>免費歌詞試做</h1>
  <p class="lede">不用 AI、不花錢：從抱怨裡抓出「誰、什麼東西、什麼時候」，填進情境的歌詞範本。邊打字邊更新。範本與詞庫在 <code>js/lyrics.js</code>。</p>

  <div class="layout">
    <div>
      <section class="card">
        <h2>寄放抱怨</h2>
        <label class="field"><span>情境</span><select id="scenario"></select></label>
        <label class="field"><span>抱怨（選填）</span>
          <textarea id="complaint" placeholder="例：週五下午五點半，老闆說簡報要大改"></textarea>
        </label>
        <div class="examples" id="examples"></div>
      </section>

      <section class="card">
        <h2>抓到的關鍵字</h2>
        <dl class="keywords" id="keywords"></dl>
      </section>
    </div>

    <section class="card">
      <h2>歌詞</h2>
      <ol class="lyrics" id="lyrics"></ol>
      <p class="legend"><span class="user">金色</span>＝從你的抱怨抓到的字；虛線＝沒抓到，用情境預設值。</p>
    </section>
  </div>
</main>

<script src="../js/content.js"></script>
<script src="../js/lyrics.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const scenarios = [...SCENARIOS, FALLBACK_SCENARIO];

$("#scenario").innerHTML = scenarios.map((sc, i) => `<option value="${i}">${sc.label}</option>`).join("");

const EXAMPLES = [
  [0, "主管只說要有感覺，提案改了三次還是不知道他要什麼"],
  [1, "客戶半夜傳來第九版的設計稿意見，最後說用第一版"],
  [2, "週五下班前老闆丟來一份報表說很簡單"],
  [3, "說好幫同事看一下網站，結果經理說之後都交給我"],
  [4, "連假在墾丁，PM 一直問會議記錄放哪"],
  [5, "甲方今天又在群組裡已讀不回"],
];
$("#examples").innerHTML = EXAMPLES.map(([, text], i) => `<button type="button" data-i="${i}">${text.slice(0, 12)}⋯</button>`).join("");
$("#examples").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const [sc, text] = EXAMPLES[btn.dataset.i];
  $("#scenario").value = sc;
  $("#complaint").value = text;
  render();
});

function render() {
  const sc = scenarios[$("#scenario").value];
  const { parts, keywords } = buildLyrics(sc, $("#complaint").value);
  const tpl = LYRIC_TEMPLATES[sc.id] || LYRIC_TEMPLATES.other;

  $("#keywords").innerHTML = Object.entries(LYRIC_SLOTS).map(([slot, { label }]) => {
    const hit = keywords[slot];
    return `<dt>${label}</dt><dd>${hit
      ? `<span class="tag user">${hit}</span>`
      : `<span class="tag default">${tpl.defaults[slot]}</span>（沒抓到，用預設）`}</dd>`;
  }).join("");

  $("#lyrics").replaceChildren(...parts.map((line) => {
    const li = document.createElement("li");
    line.forEach((p) => {
      if (!p.slot) { li.append(p.text); return; }
      const span = document.createElement("span");
      span.className = p.fromUser ? "user" : "default";
      span.textContent = p.text;
      li.append(span);
    });
    return li;
  }));
}

$("#scenario").addEventListener("change", render);
$("#complaint").addEventListener("input", render);
render();
</script>
</body>
</html>
