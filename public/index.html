<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>職場功德所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body class="office-on">
<div id="stage"></div>
<div id="fade"></div>
<div id="office">
  <div class="tint"></div>
  <div id="soulWrap"><img id="soul" src="assets/office/soul_c.jpg" alt="靈魂"></div>
</div>
<div id="flash"></div>
<div id="officeUI"><div id="walkHint"></div></div>
<div id="vignette"></div>
<div id="hoverTip"></div>
<div id="mytalk"></div>
<div id="replies"></div>
<div id="lightbox"><img alt="梗圖"><button class="lbClose" type="button" aria-label="關閉">×</button></div>
<div id="talk"></div>
<div id="title">職場功德所</div>
<div id="hint">單指拖曳環繞・雙指縮放</div>
<div id="merit"><span>功德</span><b id="meritN">0</b></div>
<button id="voice" class="hud-btn" type="button" aria-label="人聲開關"><svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5a4 4 0 0 1 0 5"/><path d="M19.5 7a7.5 7.5 0 0 1 0 10"/></svg><svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M18 9.5l4.5 5M22.5 9.5l-4.5 5"/></svg></button>
<button id="standBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.2" r="2.2"/><path d="M12 7v6"/><path d="M12 13l-3 7M12 13l3 7"/><path d="M8.5 9.5h7"/></svg><span id="standTxt">起身走走</span></button>
<div id="knock">
  <div class="knock-top"><span>木魚</span><b><span id="knockN">0</span> / 30</b></div>
  <div class="knock-track"><div id="knockBar"></div></div>
  <button id="knockBtn" type="button" aria-label="敲木魚">敲</button>
</div>
<div id="complete">
  <div class="glow"></div>
  <div class="done-title">功德圓滿</div>
  <div class="printer"><div class="slot"></div><div class="paper-clip"><div id="receiptPaper"></div></div></div>
  <div class="done-actions">
    <button id="saveReceipt" type="button">存成圖片</button>
    <button id="printReceipt" type="button">列印收據</button>
    <button id="again" type="button">回到大殿</button>
    <button id="toOffice" type="button" class="primary">回到公司</button>
  </div>
</div>
<img id="printImg" alt="功德收據">
<div id="endRipple"></div>
<div id="endWarm"></div>
<div id="endCaption"></div>
<button id="endAct" type="button"><span id="endActLabel"></span><small>空白鍵</small></button>
<button id="endSkip" type="button">略過 ›</button>
<div id="endFinal">
  <p class="end-line">今天受的氣，已寄放。</p>
  <p class="end-line big">重新開始吧。</p>
  <button id="endAgain" type="button">再寄放一次</button>
</div>
<div id="bubble"><span class="who">小師父</span><span id="say"></span></div>
<div id="ktv" aria-hidden="true"><img id="ktvBg" alt=""><div id="ktvGlass"></div>
  <div id="ktvHead"><span class="kw">KARAOKE</span><span class="kt"></span><span class="kc"></span></div>
  <div id="ktvSub"><span class="l1"><span class="on"></span><span class="off"></span></span><span class="l2"></span></div>
</div>
<form id="ask" autocomplete="off">
  <textarea id="q" rows="1" placeholder="說說今天的職場苦水⋯⋯" maxlength="300"></textarea>
  <button id="send" type="submit" disabled>上香</button>
</form>
<div id="loading">上班打卡中⋯</div>

<script src="js/lyric-library.js"></script>
<script src="js/lyrics.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
