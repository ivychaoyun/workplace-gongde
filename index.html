<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>職場功德所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rap.css">
</head>
<body>
  <header class="site-header">
    <p class="seal">職場<br>功德所</p>
    <ol class="progress" aria-label="進度">
      <li data-step="deposit" class="is-current">寄放</li>
      <li data-step="album">專輯</li>
      <li data-step="fish">木魚</li>
      <li data-step="complete">圓滿</li>
    </ol>
  </header>

  <main>
    <!-- 步驟一：寄放抱怨 -->
    <section class="step is-active" id="step-deposit">
      <h1 class="title">今天受的氣，<br>先寄放這裡。</h1>
      <p class="lede">選一個最接近的情境，或直接寫下來。小師父會請 AI 把它寫成饒舌歌詞，內容不會被保存。</p>

      <div class="scenario-grid" id="scenario-grid"></div>

      <label class="field">
        <span class="field-label">想多說一點？（選填，匿名）</span>
        <textarea id="complaint" rows="3" maxlength="300" placeholder="例：週五下午五點半，又說要「小改一下」⋯⋯"></textarea>
      </label>

      <button class="btn btn-primary" id="to-album" disabled>寄放，做成專輯</button>
    </section>

    <!-- 步驟二：抱怨專輯（封面＋饒舌） -->
    <section class="step" id="step-album">
      <p class="case-tag">你的抱怨專輯出爐了</p>
      <p class="roast" id="album-roast"></p>

      <div class="album">
        <canvas class="cover" id="cover" width="1080" height="1080" aria-label="專輯封面"></canvas>
        <div class="album-track">
          <p class="track-label">主打歌</p>
          <blockquote class="lyrics" id="album-lyrics"></blockquote>
          <audio id="song" controls preload="metadata"></audio>
          <p class="placeholder" id="song-placeholder">主打歌待補 <small id="song-path"></small></p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" data-back="deposit">← 重新寄放</button>
        <button class="btn btn-primary" id="to-fish">去敲木魚 →</button>
      </div>
    </section>

    <!-- 步驟三：敲木魚 -->
    <section class="step" id="step-fish">
      <h2 class="title">敲木魚，<br>把怨氣敲散。</h2>
      <div class="fish">
        <button class="fish-btn" id="fish-btn" aria-label="敲木魚">
          <span class="fish-body">木魚</span>
        </button>
        <div class="fish-progress" aria-hidden="true"><span id="fish-bar"></span></div>
        <p class="fish-count"><strong id="fish-count">0</strong> / <span id="fish-goal"></span></p>
      </div>
    </section>

    <!-- 步驟四：功德圓滿＋分享 -->
    <section class="step" id="step-complete">
      <h2 class="title">功德圓滿。</h2>
      <p class="lede">今天還做了哪些照顧自己的事？勾起來，會一起印在分享圖上。功德不等於忍耐，守住界線也算數。</p>

      <div class="complete">
        <canvas class="cover" id="share-card" width="1080" height="1080" aria-label="分享圖"></canvas>
        <div class="merit-list" id="merit-list"></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="restart">再寄放一次</button>
        <div class="actions-right">
          <button class="btn btn-ghost" id="download">下載圖片</button>
          <button class="btn btn-primary" id="share">分享到社群</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/content.js"></script>
  <script src="js/rap.js"></script>
  <script src="js/album.js"></script>
  <script src="js/merit.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
