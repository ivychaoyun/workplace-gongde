<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>職場功德所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modes.css">
  <link rel="stylesheet" href="css/rap.css">
</head>
<body>
  <header class="site-header">
    <p class="seal">職場<br>功德所</p>
    <ol class="progress" aria-label="進度">
      <li data-step="deposit" class="is-current">寄放</li>
      <li data-step="mode">陪伴</li>
      <li data-step="response">回應</li>
      <li data-step="slip">功德單</li>
    </ol>
  </header>

  <main>
    <!-- 步驟一：寄放抱怨 -->
    <section class="step is-active" id="step-deposit">
      <h1 class="title">今天受的氣，<br>先寄放這裡。</h1>
      <p class="lede">選一個最接近的情境，或直接寫下來。內容只留在你的瀏覽器，不會上傳。</p>

      <div class="scenario-grid" id="scenario-grid"></div>

      <label class="field">
        <span class="field-label">想多說一點？（選填，匿名）</span>
        <textarea id="complaint" rows="3" maxlength="300" placeholder="例：週五下午五點半，又說要「小改一下」⋯⋯"></textarea>
      </label>

      <button class="btn btn-primary" id="to-mode" disabled>寄放，下一步</button>
    </section>

    <!-- 步驟二：選擇陪伴模式 -->
    <section class="step" id="step-mode">
      <h2 class="title">收到了。<br>現在想要哪一種陪伴？</h2>
      <div class="mode-list" id="mode-list"></div>
      <button class="btn btn-ghost" data-back="deposit">← 回上一步</button>
    </section>

    <!-- 步驟三：回應（嘴替、梗圖、音樂） -->
    <section class="step" id="step-response">
      <p class="case-tag" id="case-tag"></p>
      <blockquote class="response-text" id="response-text"></blockquote>

      <figure class="meme">
        <img id="meme-img" alt="">
        <figcaption class="placeholder" id="meme-placeholder">梗圖待補<br><small id="meme-path"></small></figcaption>
      </figure>

      <div class="music">
        <audio id="music" controls loop preload="metadata"></audio>
        <p class="placeholder" id="music-placeholder">音樂待補 <small id="music-path"></small></p>
      </div>

      <div class="fish">
        <button class="fish-btn" id="fish-btn" aria-label="敲木魚">
          <span class="fish-body">木魚</span>
        </button>
        <p class="fish-count">敲了 <strong id="fish-count">0</strong> 下</p>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" data-back="mode">換個陪伴</button>
        <button class="btn btn-primary" data-go="merits">結算今日功德 →</button>
      </div>
    </section>

    <!-- 步驟四：勾選功德、產出功德單 -->
    <section class="step" id="step-merits">
      <h2 class="title">今天，你做了哪些照顧自己的事？</h2>
      <p class="lede">功德不等於忍耐。守住界線、好好休息，都算數。</p>
      <div class="merit-list" id="merit-list"></div>
      <div class="actions">
        <button class="btn btn-ghost" data-back="response">← 回上一步</button>
        <button class="btn btn-primary" id="to-slip">領取功德單</button>
      </div>
    </section>

    <section class="step" id="step-slip">
      <article class="slip" id="slip">
        <header class="slip-head">
          <p class="slip-org">職場功德所</p>
          <h2 class="slip-title">今日功德單</h2>
          <p class="slip-meta"><span id="slip-date"></span>　No. <span id="slip-no"></span></p>
        </header>
        <dl class="slip-body">
          <dt>案由</dt><dd id="slip-case"></dd>
          <dt>判詞</dt><dd id="slip-verdict"></dd>
          <dt>今日功德</dt><dd><ul id="slip-merits"></ul></dd>
          <dt>迴向</dt><dd id="slip-blessing"></dd>
        </dl>
        <p class="slip-total">功德 <strong id="slip-total"></strong> 點</p>
        <p class="slip-foot">怨氣已寄放本所，請安心下班。</p>
      </article>
      <div class="actions no-print">
        <button class="btn btn-ghost" id="restart">再寄放一次</button>
        <button class="btn btn-primary" id="print">列印／存成 PDF</button>
      </div>
    </section>
  </main>

  <script src="js/content.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/rap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
